# FRAMEWORK-ONLY — setup.sh lo elimina de los proyectos generados.
#
# Este workflow es lo único que impide que el instalador se pudra. Sin él,
# setup.sh se rompe en silencio y no te enteras hasta el siguiente proyecto,
# semanas después, cuando ya no recuerdas qué cambiaste.
name: E2E — setup.sh

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: detecta roturas causadas por cambios externos (imagen de
    # PostgreSQL, uv, releases de Tailwind), no solo por commits propios.
    - cron: "0 6 * * 1"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analizar los scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x setup.sh scripts/lib/*.sh

  generate-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada combinación produce un proyecto distinto. Todas deben funcionar.
        include:
          - name: "Con analítica"
            flags: "--with-analytics --email-provider resend"
          - name: "Sin analítica"
            flags: "--no-analytics --email-provider console"
          - name: "SMTP"
            flags: "--no-analytics --email-provider smtp"

    name: Generar proyecto (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Correr setup.sh sobre un clon limpio
        # Sobre una copia, no sobre el checkout: setup.sh borra archivos del
        # framework y reescribe git, y no debe tocar el repo original.
        #
        # CON bootstrap, a propósito: levanta PostgreSQL con docker compose,
        # aplica las migraciones, siembra el administrador y compila el CSS. Es
        # el camino que recorre una persona de verdad, y el único que detecta
        # que una migración o el seed están rotos en un proyecto generado.
        run: |
          cp -a . /tmp/generated
          cd /tmp/generated
          ./setup.sh --non-interactive \
            --name "Proyecto de Prueba" \
            --slug proyecto-prueba \
            --description "Generado por CI" \
            --author "CI" \
            --git-mode keep \
            ${{ matrix.flags }}

      - name: El proyecto generado quedó personalizado
        run: |
          cd /tmp/generated
          grep -q 'name = "proyecto-prueba"' pyproject.toml
          grep -q "Proyecto de Prueba" PROJECT.md
          # Ningún token sin sustituir fuera de scripts/ y docs/
          ! grep -rIl --exclude-dir=.git --exclude-dir=scripts --exclude-dir=docs \
              -e '__KIRO_[A-Z_]*__' .
          # Las plantillas de Basecoat siguen intactas
          grep -rq '{%' app/templates/basecoat/

      - name: El proyecto generado pasa su propia puerta de calidad
        # `make check` entero —lint, tipos, TESTS y migraciones pendientes—, no
        # solo lo que no necesita base de datos. Antes esta parte se saltaba los
        # tests, y con ello todo lo que vive en PostgreSQL: auth, sesiones, el
        # seed. Justo la clase de fallo que solo aparece en un proyecto generado.
        run: |
          cd /tmp/generated
          make check

      - name: El bootstrap dejó el proyecto en marcha
        run: |
          cd /tmp/generated
          test -s app/static/css/app.css
          # El administrador se sembró y tiene su rol.
          uv run python -c "
          from sqlalchemy import text
          from app.db import engine
          with engine.connect() as c:
              rows = c.execute(text('''
                  SELECT u.email, r.slug FROM users u
                  JOIN user_roles ur ON ur.user_id = u.id
                  JOIN roles r ON r.id = ur.role_id''')).fetchall()
          assert rows and rows[0][1] == 'admin', f'sin administrador sembrado: {rows}'
          print('administrador:', rows[0][0])
          "

      - name: El proyecto generado arranca y sirve páginas
        # Que pase los tests y que arranque de verdad no son lo mismo: una
        # plantilla rota o un middleware mal montado pasa pytest y revienta al
        # servir la primera página.
        run: |
          cd /tmp/generated
          uv run uvicorn app.main:app --port 8123 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8123/health > /dev/null
          curl -sf -D /tmp/headers.txt http://127.0.0.1:8123/login -o /tmp/login.html
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^x-request-id:' /tmp/headers.txt
          grep -qi 'set-cookie: csrf_token=' /tmp/headers.txt
          grep -q 'name="csrf_token"' /tmp/login.html
          # Un POST sin token tiene que rebotar.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8123/login -d 'email=x@example.com&password=x')" = "403"

      - name: Regresión — caracteres de control en las respuestas
        # Pulsar las flechas del teclado al responder una pregunta insertaba
        # secuencias de escape en el valor, y eso producía un pyproject.toml
        # inválido que uv se negaba a leer. El instalador se detenía a mitad.
        run: |
          rm -rf /tmp/ctrl && cp -a . /tmp/ctrl && cd /tmp/ctrl
          rm -f .env .kiro-setup-done
          DESC=$(printf 'Texto con\x1b[C\x1b[C escapes\x1b[1;31m dentro')
          ./setup.sh --non-interactive --name "Con Escapes" --slug con-escapes \
            --description "$DESC" --author CI --git-mode keep --no-bootstrap --no-analytics
          python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          desc = data['project']['description']
          assert '\x1b' not in desc, 'quedó un byte de escape'
          assert '[C' not in desc, f'quedó basura ANSI visible: {desc!r}'
          print('OK:', desc)
          "

      - name: Correr setup.sh dos veces aborta sin destruir nada
        run: |
          cd /tmp/generated
          cp .env /tmp/env-antes
          ! ./setup.sh --non-interactive --name "Otro" --no-bootstrap --git-mode keep
          diff -q .env /tmp/env-antes
