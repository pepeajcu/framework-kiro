# FRAMEWORK-ONLY — setup.sh lo elimina de los proyectos generados.
#
# Este workflow es lo único que impide que el instalador se pudra. Sin él,
# setup.sh se rompe en silencio y no te enteras hasta el siguiente proyecto,
# semanas después, cuando ya no recuerdas qué cambiaste.
name: E2E — setup.sh

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: detecta roturas causadas por cambios externos (imagen de
    # PostgreSQL, uv, releases de Tailwind), no solo por commits propios.
    - cron: "0 6 * * 1"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analizar los scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x setup.sh scripts/lib/*.sh

  entornos-hostiles:
    runs-on: ubuntu-latest
    name: El instalador sobrevive a una máquina pobre
    # Los fallos de este job no aparecen en la máquina de quien desarrolla el
    # framework, que tiene todo instalado: aparecen en el portátil recién
    # formateado de quien clona el repositorio por primera vez.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Un locale sin UTF-8 no rompe el slug
        # `sed y/áé…/ae…/` cuenta BYTES fuera de UTF-8, así que los dos
        # conjuntos dejaban de medir lo mismo y sed abortaba. El slug salía
        # vacío y la pregunta se repetía sin un default válido.
        run: |
          out=$(LC_ALL=C LANG=C bash -c '
            source scripts/lib/log.sh
            source scripts/lib/prompt.sh
            prompt::slugify "Peluquería Ñandú & Co."')
          test "$out" = "peluqueria-nandu-co" || { echo "slug inesperado: '$out'"; exit 1; }

      - name: Sin stdin y con un default inválido, aborta en vez de colgarse
        run: |
          set +e
          timeout 30 bash -c '
            source scripts/lib/log.sh
            source scripts/lib/prompt.sh
            prompt::ask "Identificador" "" validate::slug' </dev/null >/dev/null 2>&1
          status=$?
          set -e
          # 124 es el timeout: significa que volvió el bucle infinito.
          test "$status" -eq 1 || { echo "esperaba salida 1, hubo $status"; exit 1; }

      - name: uv instalado fuera del PATH se encuentra igual
        # En Debian y Ubuntu ~/.profile añade ~/.local/bin solo si ya existía al
        # iniciar sesión: tras instalar uv, sigue invisible hasta el siguiente
        # login. El instalador lo descargaba, no lo veía, y moría.
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$(command -v uv)" "$HOME/.local/bin/uv"
          out=$(env PATH=/usr/bin:/bin bash -c '
            source scripts/lib/log.sh
            source scripts/lib/prompt.sh
            source scripts/lib/preflight.sh
            preflight::ensure_uv true' 2>&1)
          echo "$out"
          echo "$out" | grep -q "fuera del PATH"

      - name: Con el daemon de Docker caído, recomienda arreglarlo
        # El caso real: docker instalado, compose v2 disponible, daemon sin
        # responder (servicio parado o usuario fuera del grupo 'docker').
        run: |
          mkdir -p /tmp/nodocker
          # 'docker compose version' funciona; todo lo demás —'docker info'
          # incluido— falla, que es lo que se ve con el daemon parado.
          printf '%s\n' '#!/bin/sh' \
            '[ "$1" = compose ] && [ "$2" = version ] && exit 0' \
            'exit 1' > /tmp/nodocker/docker
          chmod +x /tmp/nodocker/docker

          rm -rf /tmp/sin-docker && cp -a . /tmp/sin-docker && cd /tmp/sin-docker

          # Con stdin cerrado toda pregunta toma su valor por defecto, y el de
          # ésta es NO: arreglar Docker tiene que ser lo que sale de pulsar
          # Enter, no la salida de emergencia.
          set +e
          PATH=/tmp/nodocker:$PATH timeout 600 ./setup.sh \
            --git-mode keep --keep-framework-files </dev/null > /tmp/rechazo.txt 2>&1
          status=$?
          set -e
          cat /tmp/rechazo.txt
          test "$status" -eq 1 || { echo "esperaba salida 1, hubo $status"; exit 1; }
          grep -q "el daemon de Docker no responde" /tmp/rechazo.txt
          grep -q "Recomendado" /tmp/rechazo.txt
          grep -q "sudo systemctl enable --now docker" /tmp/rechazo.txt
          grep -q "usermod -aG docker" /tmp/rechazo.txt
          grep -q "termina el trabajo entero" /tmp/rechazo.txt
          # Y no tocó nada: el fallo es anterior a la primera escritura.
          test ! -f .env

      - name: Quien aun así elige seguir, se lleva el proyecto configurado
        run: |
          cd /tmp/sin-docker
          printf 'y\n' | PATH=/tmp/nodocker:$PATH timeout 600 ./setup.sh \
            --git-mode keep --keep-framework-files | tee /tmp/salida.txt
          test -f .env
          grep -q 'name = "mi-proyecto"' pyproject.toml
          # El mensaje final tiene que decir qué queda pendiente.
          grep -q "Pendiente: la base de datos" /tmp/salida.txt
          grep -q "make up && make migrate && make seed && make css" /tmp/salida.txt

  generate-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada combinación produce un proyecto distinto. Todas deben funcionar.
        include:
          - name: "Con analítica"
            flags: "--with-analytics --email-provider resend"
          - name: "Sin analítica"
            flags: "--no-analytics --email-provider console"
          - name: "SMTP"
            flags: "--no-analytics --email-provider smtp"

    name: Generar proyecto (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Correr setup.sh sobre un clon limpio
        # Sobre una copia, no sobre el checkout: setup.sh borra archivos del
        # framework y reescribe git, y no debe tocar el repo original.
        #
        # CON bootstrap, a propósito: levanta PostgreSQL con docker compose,
        # aplica las migraciones, siembra el administrador y compila el CSS. Es
        # el camino que recorre una persona de verdad, y el único que detecta
        # que una migración o el seed están rotos en un proyecto generado.
        run: |
          cp -a . /tmp/generated
          cd /tmp/generated
          ./setup.sh --non-interactive \
            --name "Proyecto de Prueba" \
            --slug proyecto-prueba \
            --description "Generado por CI" \
            --author "CI" \
            --git-mode keep \
            ${{ matrix.flags }}

      - name: El proyecto generado quedó personalizado
        run: |
          cd /tmp/generated
          grep -q 'name = "proyecto-prueba"' pyproject.toml
          grep -q "Proyecto de Prueba" PROJECT.md
          # Ningún token sin sustituir fuera de scripts/ y docs/
          ! grep -rIl --exclude-dir=.git --exclude-dir=scripts --exclude-dir=docs \
              -e '__KIRO_[A-Z_]*__' .
          # Las plantillas de Basecoat siguen intactas
          grep -rq '{%' app/templates/basecoat/

      - name: El proyecto generado pasa su propia puerta de calidad
        # `make check` entero —lint, tipos, TESTS y migraciones pendientes—, no
        # solo lo que no necesita base de datos. Antes esta parte se saltaba los
        # tests, y con ello todo lo que vive en PostgreSQL: auth, sesiones, el
        # seed. Justo la clase de fallo que solo aparece en un proyecto generado.
        run: |
          cd /tmp/generated
          make check

      - name: El bootstrap dejó el proyecto en marcha
        run: |
          cd /tmp/generated
          test -s app/static/css/app.css
          # El administrador se sembró y tiene su rol.
          uv run python -c "
          from sqlalchemy import text
          from app.db import engine
          with engine.connect() as c:
              rows = c.execute(text('''
                  SELECT u.email, r.slug FROM users u
                  JOIN user_roles ur ON ur.user_id = u.id
                  JOIN roles r ON r.id = ur.role_id''')).fetchall()
          assert rows and rows[0][1] == 'admin', f'sin administrador sembrado: {rows}'
          print('administrador:', rows[0][0])
          "

      - name: El proyecto generado arranca y sirve páginas
        # Que pase los tests y que arranque de verdad no son lo mismo: una
        # plantilla rota o un middleware mal montado pasa pytest y revienta al
        # servir la primera página.
        run: |
          cd /tmp/generated
          uv run uvicorn app.main:app --port 8123 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8123/health > /dev/null
          curl -sf -D /tmp/headers.txt http://127.0.0.1:8123/login -o /tmp/login.html
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^x-request-id:' /tmp/headers.txt
          grep -qi 'set-cookie: csrf_token=' /tmp/headers.txt
          grep -q 'name="csrf_token"' /tmp/login.html
          # Un POST sin token tiene que rebotar.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8123/login -d 'email=x@example.com&password=x')" = "403"

      - name: Regresión — caracteres de control en las respuestas
        # Pulsar las flechas del teclado al responder una pregunta insertaba
        # secuencias de escape en el valor, y eso producía un pyproject.toml
        # inválido que uv se negaba a leer. El instalador se detenía a mitad.
        run: |
          rm -rf /tmp/ctrl && cp -a . /tmp/ctrl && cd /tmp/ctrl
          rm -f .env .kiro-setup-done
          DESC=$(printf 'Texto con\x1b[C\x1b[C escapes\x1b[1;31m dentro')
          ./setup.sh --non-interactive --name "Con Escapes" --slug con-escapes \
            --description "$DESC" --author CI --git-mode keep --no-bootstrap --no-analytics
          python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          desc = data['project']['description']
          assert '\x1b' not in desc, 'quedó un byte de escape'
          assert '[C' not in desc, f'quedó basura ANSI visible: {desc!r}'
          print('OK:', desc)
          "

      - name: Correr setup.sh dos veces aborta sin destruir nada
        run: |
          cd /tmp/generated
          # setup.sh se borró a sí mismo al limpiar los archivos del framework.
          # Sin reponerlo, esto medía un 127 de "command not found": el paso
          # pasaba en verde sin llegar a ejecutar la guarda del marcador.
          cp "$GITHUB_WORKSPACE/setup.sh" setup.sh
          cp -r "$GITHUB_WORKSPACE/scripts/lib" scripts/lib
          cp .env /tmp/env-antes
          set +e
          ./setup.sh --non-interactive --name "Otro" --no-bootstrap --git-mode keep
          status=$?
          set -e
          test "$status" -eq 1 || { echo "esperaba salida 1, hubo $status"; exit 1; }
          diff -q .env /tmp/env-antes
