# Comprobaciones antes de cada commit.
#
# Esto NO es opcional en Kiro: Python no trae compilador, así que estos hooks y
# CI son lo único que impide que llegue a main código con tipos rotos.
# Ver docs/decisions/0001-python-sobre-go.md.
#
# Instalar una vez por clon:  uv run pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      # Última línea de defensa contra commitear una clave privada.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Hooks locales: corren en el entorno de `uv`, el mismo que `make check`. El hook
  # de mypy de pre-commit.com monta un entorno aparte con una lista de
  # dependencias que hay que mantener a mano; se desfasó (le faltaban httpx2,
  # argon2, itsdangerous...) y fallaba en un entorno que `make types` no usa.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy app scripts/archcheck.py
        language: system
        pass_filenames: false
        files: ^(app|scripts)/.*\.py$
      - id: archcheck
        name: reglas de arquitectura (AGENTS.md)
        entry: uv run python -m scripts.archcheck
        language: system
        pass_filenames: false
        files: ^app/

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [-x]

exclude: |
  (?x)^(
    app/static/(css|js)/vendor/.*|
    app/templates/basecoat/.*|
    migrations/versions/.*|
    .claude/skills/kiro-design/references/(minimalist|soft|brutalist|redesign|brandkit)\.md|
    .claude/skills/kiro-design/uupm/.*
  )$
