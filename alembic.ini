# Configuración de Alembic.
#
# Aquí NO hay URL de base de datos a propósito: migrations/env.py la lee de
# app.config, que a su vez lee .env. Una sola fuente de verdad — si estuviera
# también aquí, tarde o temprano apuntarían a bases distintas.

[alembic]
script_location = migrations
prepend_sys_path = .

# Cómo separar las rutas de prepend_sys_path. 'os' usa el separador del sistema.
# Sin esto Alembic avisa de que usa el modo antiguo (partir por espacios, comas
# y dos puntos), que rompe con rutas que contienen cualquiera de esos caracteres.
path_separator = os

# Prefijo de fecha en el nombre del archivo: las migraciones se ordenan
# cronológicamente en el listado, no por un hash aleatorio.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Zona horaria de esos nombres. UTC evita que dos personas en husos distintos
# generen migraciones que parecen desordenadas.
timezone = UTC

[post_write_hooks]
# Las migraciones autogeneradas pasan por el linter y el formateador, igual que
# el resto del código: así no ensucian el diff con su propio estilo y, sobre
# todo, no rompen 'make check' nada más generarlas.
#
# El orden importa: primero se arregla (imports, reglas), luego se formatea.
hooks = ruff_lint, ruff_format
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
