# Contrato de diseño del proyecto. Lo compila `make design build`.
# La intención (tono, referencias, firma visual) vive en DESIGN.md; aquí solo
# lo que una máquina puede aplicar. Atajos que lo reescriben: `make brand-colors`,
# `make font`. Verifícalo con `make design-check`.

[brand]
primary   = "#171717"
neutral   = "pure"   # pure | warm | cool | tinted
surface   = "light"   # light | cream | dark
secondary = ""   # opcional: un segundo color de marca
radius    = "0.625rem"

[type]
# Fuentes de Fontsource, siempre locales (woff2 en app/static/fonts/).
# display = { name = "Nombre", weights = [400, 700] }   # titulares
# body    = { name = "Nombre", weights = [400, 700] }   # texto
# mono    = { name = "Nombre", weights = [400, 700] }   # código y datos

[basecoat]
theme = "vega"   # vega | nova | maia | lyra | mira | luma | sera | rhea

[motion]
level = 3   # 1-3 CSS · 4-6 motion.js · 7-8 Motion · 9-10 GSAP

[structure]
header = "sticky-blur"   # sticky-blur | floating-pill | industrial-rule | terminal-bar | custom
